<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b24;
    --panel2: #1c2230;
    --border: #2a3444;
    --text: #dbe4f0;
    --dim: #8291a8;
    --accent: #f5b942;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a2332, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(245, 185, 66, 0.35);
  }
  h1 small { color: var(--dim); font-weight: 400; letter-spacing: 2px; font-size: 12px; margin-left: 8px; }
  .stage {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .field-wrap {
    position: relative;
    border: 2px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    background: #000;
    overflow: hidden;
  }
  canvas { display: block; }

  /* 覆盖层（开始 / 结束 / 过关） */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 10, 15, 0.86);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 20px;
    transition: opacity .25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .title { font-size: 34px; font-weight: 800; letter-spacing: 4px; color: var(--accent); text-shadow: 0 0 20px rgba(245,185,66,.5); }
  .overlay .title.good { color: var(--green); text-shadow: 0 0 20px rgba(74,222,128,.5); }
  .overlay .title.bad { color: var(--red); text-shadow: 0 0 20px rgba(248,113,113,.5); }
  .overlay .sub { color: var(--dim); font-size: 14px; line-height: 1.7; }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 11px 26px;
    font-size: 16px;
    border-radius: 8px;
    letter-spacing: 2px;
    transition: all .15s ease;
  }
  .btn:hover { background: #273044; border-color: var(--accent); color: var(--accent); }
  .keys { color: var(--dim); font-size: 13px; }
  .keys b { color: var(--text); font-weight: 600; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; margin: 0 2px; }

  /* 侧边栏 */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 14px;
  }
  .panel h2 { font-size: 12px; color: var(--dim); letter-spacing: 2px; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; align-items: center; }
  .stat .v { font-weight: 700; font-size: 18px; color: var(--accent); }
  .lives .icons { display: flex; gap: 6px; flex-wrap: wrap; }
  .tank-icon { width: 18px; height: 18px; border-radius: 3px; }
  .enemy-dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .enemy-dot { width: 9px; height: 9px; border-radius: 2px; background: var(--red); }
  .mute { cursor: pointer; border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 7px; font-size: 12px; }
  .legend { color: var(--dim); font-size: 12px; line-height: 1.9; }
  .legend .r { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
</style>
</head>
<body>
  <h1>坦克大战 <small>TANK BATTLE</small></h1>
  <div class="stage">
    <div class="field-wrap">
      <canvas id="game" width="640" height="640"></canvas>

      <div id="startScreen" class="overlay">
        <div class="title">坦克大战</div>
        <div class="keys">
          <b>W A S D</b> / <b>方向键</b> 移动 &nbsp;&nbsp; <b>空格</b> / <b>J</b> 开火
        </div>
        <div class="sub">保护你的基地 🦅，消灭所有敌方坦克。<br>击碎砖墙、躲避炮火、撑到通关！</div>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>

      <div id="pauseScreen" class="overlay hidden">
        <div class="title">已暂停</div>
        <button class="btn" id="resumeBtn">继续游戏</button>
      </div>

      <div id="endScreen" class="overlay hidden">
        <div class="title bad" id="endTitle">游戏结束</div>
        <div class="sub" id="endText"></div>
        <button class="btn" id="restartBtn">再来一局</button>
      </div>
    </div>

    <div class="panel">
      <div>
        <h2>得分</h2>
        <div class="stat"><span id="score">0</span></div>
      </div>
      <div>
        <h2>最高分</h2>
        <div class="stat"><span id="hiScore">0</span></div>
      </div>
      <div>
        <h2>生命</h2>
        <div class="lives icons" id="lives"></div>
      </div>
      <div>
        <h2>关卡</h2>
        <div class="stat"><span id="level">1</span></div>
      </div>
      <div>
        <h2>剩余敌人</h2>
        <div class="enemy-dots" id="enemiesLeft"></div>
      </div>
      <button class="mute" id="muteBtn">🔊 音效：开</button>
      <div class="legend">
        <div><span class="r" style="background:#4ade80"></span>玩家</div>
        <div><span class="r" style="background:#f87171"></span>普通坦克</div>
        <div><span class="r" style="background:#fbbf24"></span>快速坦克</div>
        <div><span class="r" style="background:#a78bfa"></span>重型坦克 ×2</div>
        <div><span class="r" style="background:#9a5b3a"></span>砖墙（可击碎）</div>
        <div><span class="r" style="background:#8b95a5"></span>钢墙（不可击碎）</div>
        <div><span class="r" style="background:#3b82f6"></span>水域（坦克不可过）</div>
      </div>
    </div>
  </div>

<script>
"use strict";

// ============ 基础常量 ============
const TILE = 32;
const COLS = 20, ROWS = 20;
const FIELD_W = COLS * TILE, FIELD_H = ROWS * TILE;
const TANK_SIZE = 28;
const BULLET_SIZE = 8;
const PLAYER_SPEED = 112;
const BULLET_SPEED = 280;
const MAX_LEVEL = 3;

const DIRS = {
  up:    { x: 0,  y: -1, a: 0 },
  right: { x: 1,  y: 0,  a: Math.PI / 2 },
  down:  { x: 0,  y: 1,  a: Math.PI },
  left:  { x: -1, y: 0,  a: -Math.PI / 2 },
};
const DIR_LIST = ["up", "right", "down", "left"];

const ENEMY_TYPES = [
  { color: "#f87171", tread: "#7f1d1d", speed: 55, hp: 1, score: 100 },
  { color: "#fbbf24", tread: "#854d0e", speed: 88, hp: 1, score: 200 },
  { color: "#a78bfa", tread: "#4c1d95", speed: 46, hp: 2, score: 300 },
];

// 关卡地图：20 行 × 20 列。符号含义：
//  . 空地   # 砖墙   @ 钢墙   % 水域   T 树林(遮蔽)   B 基地
const LEVELS = [
  [
    "....................",
    "....................",
    "..##..........##....",
    "..##..........##....",
    "....................",
    "....##......##......",
    "....##......##......",
    "....................",
    "......##..##........",
    "......##..##........",
    "....................",
    "....##......##......",
    "....##......##......",
    "....................",
    "..##..........##....",
    "..##..........##....",
    "....................",
    "........####........",
    "........#BB#........",
    "....................",
  ],
  [
    "....................",
    ".@@............@@...",
    ".@@............@@...",
    "....................",
    "....####..####......",
    "....#%%#..#%%#......",
    "....#%%#..#%%#......",
    "....####..####......",
    "....................",
    "......TTTTTT........",
    "......TTTTTT........",
    "....................",
    "....####..####......",
    "....#%%#..#%%#......",
    "....#%%#..#%%#......",
    "....####..####......",
    "....................",
    "........####........",
    "........#BB#........",
    "....................",
  ],
  [
    "....................",
    ".@@@..........@@@...",
    ".@#@..........@#@...",
    ".@@@..........@@@...",
    "....%%....%%........",
    "....%%....%%........",
    "....................",
    "..@@@@@@@@@@@@@@....",
    "....##....##........",
    "....##....##........",
    "......####..........",
    "......#%%#..........",
    "......####..........",
    "....##....##........",
    "....##....##........",
    "..@@@@@@@@@@@@@@....",
    "....................",
    "........####........",
    "........#BB#........",
    "....................",
  ],
];

// ============ DOM ============
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const hiScoreEl = document.getElementById("hiScore");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const enemiesLeftEl = document.getElementById("enemiesLeft");
const startScreen = document.getElementById("startScreen");
const pauseScreen = document.getElementById("pauseScreen");
const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");
const muteBtn = document.getElementById("muteBtn");

// ============ 音效 ============
let audioCtx = null;
let soundOn = true;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, vol) {
  if (!soundOn || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function sndShoot() { tone(880, 0.06, "square", 0.04); }
function sndBrick()  { tone(220, 0.06, "triangle", 0.05); }
function sndSteel()  { tone(180, 0.04, "square", 0.04); }
function sndBoom()   { tone(120, 0.22, "sawtooth", 0.08); }
function sndHit()    { tone(300, 0.15, "square", 0.06); }
function sndOver()   { tone(400, 0.5, "sawtooth", 0.06); setTimeout(() => tone(180, 0.6, "sawtooth", 0.06), 250); }

// ============ 游戏状态 ============
let state = "start"; // start | playing | paused | levelclear | gameover | win
let grid = [];
let player = null;
let enemies = [];
let bullets = [];      // 玩家子弹
let ebullets = [];     // 敌方子弹
let particles = [];
let score = 0, hiScore = 0, lives = 3, level = 1;
let spawnQueue = [], spawnTimer = 0, spawnInterval = 1.8;
let maxAlive = 4;
let shake = 0;
let frame = 0;

const keys = new Set();

try { hiScore = parseInt(localStorage.getItem("tank-hiscore") || "0", 10) || 0; } catch (e) {}

// ============ 工具 ============
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ============ 地图 ============
function loadLevel(n) {
  const idx = (n - 1) % LEVELS.length;
  const raw = LEVELS[idx];
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    const row = (raw[r] || "").padEnd(COLS, ".").slice(0, COLS).split("");
    grid.push(row);
  }
  // 确保基地位置正确
  const bc = Math.floor(COLS / 2) - 1;
  grid[ROWS - 2][bc] = "B";
  grid[ROWS - 2][bc + 1] = "B";
}

function buildSpawnQueue(n) {
  const total = [10, 14, 18][(n - 1) % 3];
  const q = [];
  for (let i = 0; i < total; i++) {
    const r = Math.random();
    if (n === 1) q.push(r < 0.72 ? 0 : r < 0.92 ? 1 : 2);
    else if (n === 2) q.push(r < 0.5 ? 0 : r < 0.8 ? 1 : 2);
    else q.push(r < 0.35 ? 0 : r < 0.65 ? 1 : 2);
  }
  return q;
}

function spawnPoints() {
  const y = 2;
  const xs = [2, COLS * TILE / 2 - TANK_SIZE / 2, FIELD_W - TANK_SIZE - 2];
  return shuffle([...xs]).map(x => ({ x, y }));
}

function spawnEnemy() {
  const type = spawnQueue.shift();
  const pts = spawnPoints();
  let pos = null;
  for (const p of pts) {
    if (!enemies.some(e => Math.abs(e.x - p.x) < TANK_SIZE && Math.abs(e.y - p.y) < TANK_SIZE)) { pos = p; break; }
  }
  if (!pos) pos = pts[0];
  const st = ENEMY_TYPES[type];
  enemies.push({
    x: pos.x, y: pos.y, dir: "down", speed: st.speed, type, hp: st.hp,
    color: st.color, tread: st.tread, score: st.score, isEnemy: true,
    dirTimer: Math.random() * 1.5 + 0.5,
    shootTimer: Math.random() * 1.5 + 0.8,
  });
}

function resetPlayer() {
  const cx = FIELD_W / 2 - TANK_SIZE / 2;
  const cy = (ROWS - 4) * TILE + (TILE - TANK_SIZE) / 2;
  player = { x: cx, y: cy, dir: "up", speed: PLAYER_SPEED, isEnemy: false, inv: 2.5, shootCd: 0 };
}

// ============ 碰撞 ============
function cellAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return { oob: true, v: "." };
  return { oob: false, v: grid[r][c], c, r };
}
function tankSolid(v) { return v === "#" || v === "@" || v === "%" || v === "B"; }

function cellsInRect(x, y, w, h) {
  const c0 = Math.floor(x / TILE), r0 = Math.floor(y / TILE);
  const c1 = Math.floor((x + w - 0.01) / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  const out = [];
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) out.push({ c, r });
  return out;
}

function blockedByWalls(x, y, w, h) {
  if (x < 0 || y < 0 || x + w > FIELD_W || y + h > FIELD_H) return true;
  for (const cell of cellsInRect(x, y, w, h)) {
    const v = grid[cell.r] && grid[cell.r][cell.c];
    if (v === undefined) return true;
    if (tankSolid(v)) return true;
  }
  return false;
}

function overlapsTank(x, y, w, h, self) {
  const list = self && self.isEnemy ? enemies : self && !self.isEnemy ? [player] : null;
  const all = [];
  if (player) all.push(player);
  all.push(...enemies);
  for (const t of all) {
    if (t === self || !t) continue;
    if (x < t.x + TANK_SIZE && x + w > t.x && y < t.y + TANK_SIZE && y + h > t.y) return true;
  }
  return false;
}

function collides(x, y, w, h, self) {
  return blockedByWalls(x, y, w, h) || overlapsTank(x, y, w, h, self);
}

// ============ 实体更新 ============
function moveTank(t, dt) {
  const d = DIRS[t.dir];
  const nx = t.x + d.x * t.speed * dt;
  const ny = t.y + d.y * t.speed * dt;
  if (!collides(nx, ny, TANK_SIZE, TANK_SIZE, t)) {
    t.x = nx; t.y = ny;
    return true;
  }
  if (t.isEnemy) chooseDir(t, true);
  return false;
}

function chooseDir(t, excludeCurrent) {
  const opts = DIR_LIST.filter(d => d !== (excludeCurrent ? t.dir : null));
  // 优先朝玩家方向（敌人有概率追踪）
  if (t.isEnemy && player && Math.random() < 0.4) {
    const dx = player.x - t.x, dy = player.y - t.y;
    const pref = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    if (!collides(t.x + DIRS[pref].x * 8, t.y + DIRS[pref].y * 8, TANK_SIZE, TANK_SIZE, t)) {
      t.dir = pref; return;
    }
  }
  const viable = opts.filter(d => !collides(t.x + DIRS[d].x * 8, t.y + DIRS[d].y * 8, TANK_SIZE, TANK_SIZE, t));
  t.dir = (viable.length ? viable : opts)[Math.floor(Math.random() * (viable.length || opts.length))];
}

function shoot(tank) {
  const d = DIRS[tank.dir];
  const cx = tank.x + TANK_SIZE / 2 - BULLET_SIZE / 2 + d.x * (TANK_SIZE / 2);
  const cy = tank.y + TANK_SIZE / 2 - BULLET_SIZE / 2 + d.y * (TANK_SIZE / 2);
  const b = { x: cx, y: cy, dir: tank.dir, speed: BULLET_SPEED, alive: true, fromPlayer: !tank.isEnemy };
  if (tank.isEnemy) ebullets.push(b); else bullets.push(b);
  sndShoot();
}

function updateBullet(b, dt) {
  const d = DIRS[b.dir];
  let dist = b.speed * dt;
  const step = 5;
  while (dist > 0 && b.alive) {
    const m = Math.min(step, dist);
    b.x += d.x * m; b.y += d.y * m; dist -= m;

    // 出界
    if (b.x < 0 || b.y < 0 || b.x + BULLET_SIZE > FIELD_W || b.y + BULLET_SIZE > FIELD_H) { b.alive = false; break; }

    // 墙体碰撞（子弹中心点）
    const cc = Math.floor((b.x + BULLET_SIZE / 2) / TILE);
    const cr = Math.floor((b.y + BULLET_SIZE / 2) / TILE);
    const v = grid[cr] && grid[cr][cc];
    if (v === "#") {
      grid[cr][cc] = ".";
      b.alive = false;
      burst(b.x, b.y, "#9a5b3a");
      sndBrick();
      break;
    } else if (v === "@") {
      b.alive = false; sndSteel(); break;
    } else if (v === "B") {
      destroyBase(); b.alive = false; break;
    }

    // 与坦克碰撞
    if (b.fromPlayer) {
      for (const e of enemies) {
        if (rectHit(b.x, b.y, BULLET_SIZE, BULLET_SIZE, e.x, e.y, TANK_SIZE, TANK_SIZE)) {
          hitEnemy(e); b.alive = false; break;
        }
      }
    } else {
      if (player && player.inv <= 0 && rectHit(b.x, b.y, BULLET_SIZE, BULLET_SIZE, player.x, player.y, TANK_SIZE, TANK_SIZE)) {
        hitPlayer(); b.alive = false; break;
      }
    }
  }
}

function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function destroyBase() {
  // 找到基地位置并标记为空，触发爆炸与游戏结束
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] === "B") { grid[r][c] = "."; burst(c * TILE + TILE / 2, r * TILE + TILE / 2, "#f87171"); }
  burst(FIELD_W / 2, (ROWS - 2) * TILE + TILE / 2, "#f87171");
  sndBoom(); shake = 0.6;
  setTimeout(() => endGame(false), 800);
}

function hitEnemy(e) {
  e.hp--;
  burst(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, e.color);
  if (e.hp <= 0) {
    const idx = enemies.indexOf(e);
    if (idx >= 0) enemies.splice(idx, 1);
    score += e.score;
    sndBoom();
    updateHUD();
    checkLevelClear();
  } else {
    sndHit();
  }
}

function hitPlayer() {
  lives--;
  burst(player.x + TANK_SIZE / 2, player.y + TANK_SIZE / 2, player.color);
  sndBoom(); shake = 0.5;
  updateHUD();
  if (lives <= 0) {
    player = null;
    setTimeout(() => endGame(false), 600);
  } else {
    resetPlayer();
  }
}

function burst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 120 + 40;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: Math.random() * 0.5 + 0.25, t: 0, color, size: Math.random() * 4 + 2,
    });
  }
}

function checkLevelClear() {
  if (enemies.length === 0 && spawnQueue.length === 0) {
    if (level >= MAX_LEVEL) { endGame(true); }
    else {
      state = "levelclear";
      showOverlay(pauseScreen, false);
      setTimeout(() => { level++; startLevel(); }, 1800);
    }
  }
}

// ============ 关卡 / 游戏流程 ============
function startGame() {
  score = 0; lives = 3; level = 1;
  updateHUD();
  startLevel();
}

function startLevel() {
  loadLevel(level);
  enemies = [];
  bullets = [];
  ebullets = [];
  particles = [];
  spawnQueue = buildSpawnQueue(level);
  spawnTimer = 0;
  maxAlive = level === 1 ? 4 : 5;
  spawnInterval = Math.max(0.9, 1.9 - level * 0.25);
  resetPlayer();
  state = "playing";
  updateHUD();
  hideAllOverlays();
}

function endGame(win) {
  state = win ? "win" : "gameover";
  if (win) {
    score += 500;
    endTitle.textContent = "恭喜通关！";
    endTitle.className = "title good";
    endText.innerHTML = "你成功守住了基地 🦅<br>最终得分：<b style='color:#f5b942'>" + score + "</b>";
  } else {
    endTitle.textContent = "游戏结束";
    endTitle.className = "title bad";
    endText.innerHTML = "最终得分：<b style='color:#f5b942'>" + score + "</b><br>到达关卡：" + level;
  }
  if (score > hiScore) {
    hiScore = score;
    try { localStorage.setItem("tank-hiscore", String(hiScore)); } catch (e) {}
  }
  updateHUD();
  sndOver();
  showOverlay(endScreen, true);
}

// ============ 覆盖层 ============
function hideAllOverlays() {
  startScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
}
function showOverlay(el, show) { el.classList.toggle("hidden", !show); }

// ============ HUD ============
function updateHUD() {
  scoreEl.textContent = score;
  hiScoreEl.textContent = hiScore;
  levelEl.textContent = level;
  livesEl.innerHTML = "";
  for (let i = 0; i < Math.max(0, lives); i++) {
    const d = document.createElement("div");
    d.className = "tank-icon";
    d.style.background = "#4ade80";
    livesEl.appendChild(d);
  }
  const remaining = enemies.length + spawnQueue.length;
  enemiesLeftEl.innerHTML = "";
  for (let i = 0; i < remaining; i++) {
    const d = document.createElement("div");
    d.className = "enemy-dot";
    enemiesLeftEl.appendChild(d);
  }
}

// ============ 输入 ============
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","j"].includes(k) || ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
    e.preventDefault();
  }
  keys.add(k);
  if (k === "enter") {
    if (state === "start") startGame();
    else if (state === "gameover" || state === "win") startGame();
  }
  if ((k === "p" || k === "escape") && state === "playing") { state = "paused"; showOverlay(pauseScreen, true); }
  else if ((k === "p" || k === "escape") && state === "paused") { state = "playing"; hideAllOverlays(); }
});
window.addEventListener("keyup", (e) => { keys.delete(e.key.toLowerCase()); });

document.getElementById("startBtn").addEventListener("click", () => { initAudio(); startGame(); });
document.getElementById("restartBtn").addEventListener("click", () => { initAudio(); startGame(); });
document.getElementById("resumeBtn").addEventListener("click", () => { state = "playing"; hideAllOverlays(); });
muteBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  muteBtn.textContent = soundOn ? "🔊 音效：开" : "🔇 音效：关";
  initAudio();
});
canvas.addEventListener("pointerdown", () => { initAudio(); if (state === "start") startGame(); });

// ============ 主循环 ============
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  frame++;
  update(dt);
  render();
}

function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 2);

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.t >= p.life) particles.splice(i, 1);
  }

  if (state !== "playing") return;

  // 玩家
  if (player) {
    player.inv = Math.max(0, player.inv - dt);
    player.shootCd = Math.max(0, player.shootCd - dt);
    let moving = false;
    if (keys.has("w") || keys.has("arrowup")) { player.dir = "up"; moving = true; }
    else if (keys.has("s") || keys.has("arrowdown")) { player.dir = "down"; moving = true; }
    else if (keys.has("a") || keys.has("arrowleft")) { player.dir = "left"; moving = true; }
    else if (keys.has("d") || keys.has("arrowright")) { player.dir = "right"; moving = true; }
    if (moving) moveTank(player, dt);
    if ((keys.has(" ") || keys.has("j")) && player.shootCd <= 0) {
      shoot(player);
      player.shootCd = 0.28;
    }
  }

  // 敌方生成
  if (spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && enemies.length < maxAlive) {
      spawnEnemy();
      spawnTimer = spawnInterval;
    }
  }

  // 敌人
  for (const e of enemies) {
    e.dirTimer -= dt;
    e.shootTimer -= dt;
    if (e.dirTimer <= 0) { chooseDir(e, false); e.dirTimer = Math.random() * 1.6 + 0.5; }
    moveTank(e, dt);
    if (e.shootTimer <= 0) { shoot(e); e.shootTimer = Math.random() * 1.6 + 0.9; }
  }

  // 子弹
  for (const b of bullets) updateBullet(b, dt);
  for (const b of ebullets) updateBullet(b, dt);
  bullets = bullets.filter(b => b.alive);
  ebullets = ebullets.filter(b => b.alive);

  updateHUD();
}

// ============ 渲染 ============
function render() {
  ctx.save();
  ctx.clearRect(0, 0, FIELD_W, FIELD_H);
  if (shake > 0) {
    const s = shake * 6;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  // 背景
  ctx.fillStyle = "#10151d";
  ctx.fillRect(-10, -10, FIELD_W + 20, FIELD_H + 20);
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * TILE, 0); ctx.lineTo(c * TILE, FIELD_H); ctx.stroke(); }
  for (let r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * TILE); ctx.lineTo(FIELD_W, r * TILE); ctx.stroke(); }

  // 地图底层（水、砖、钢）
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = grid[r][c];
    const x = c * TILE, y = r * TILE;
    if (v === "%") drawWater(x, y);
    else if (v === "#") drawBrick(x, y);
    else if (v === "@") drawSteel(x, y);
    else if (v === "B") drawBase(x, y, r, c);
  }

  // 子弹
  for (const b of bullets) drawBullet(b, "#fef08a");
  for (const b of ebullets) drawBullet(b, "#fb923c");

  // 坦克
  if (player) drawTank(player);
  for (const e of enemies) drawTank(e);

  // 树林（画在最上层，遮挡坦克）
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r][c] === "T") drawTree(c * TILE, r * TILE);
  }

  // 粒子
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawWater(x, y) {
  ctx.fillStyle = "#0b3a6b";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#2b7fd4";
  const t = frame * 0.05;
  for (let i = 0; i < 3; i++) {
    const yy = y + ((i * 10 + t * 6) % TILE);
    ctx.beginPath();
    ctx.moveTo(x, yy);
    ctx.quadraticCurveTo(x + TILE / 4, yy - 3, x + TILE / 2, yy);
    ctx.quadraticCurveTo(x + TILE * 0.75, yy + 3, x + TILE, yy);
    ctx.lineWidth = 2; ctx.strokeStyle = "#2b7fd4"; ctx.stroke();
  }
}

function drawBrick(x, y) {
  ctx.fillStyle = "#8a4a2b";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#a85f38";
  ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
  ctx.strokeStyle = "#5e2f18";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
  ctx.beginPath();
  ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
  ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
  ctx.stroke();
}

function drawSteel(x, y) {
  ctx.fillStyle = "#7c8797";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#aab4c2";
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = "#5b6470";
  ctx.fillRect(x + 6, y + 6, TILE - 12, TILE - 12);
  ctx.strokeStyle = "#3f4650";
  ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
}

function drawBase(x, y, r, c) {
  // 只在基地左上角单元格画完整图标
  if (grid[r] && grid[r][c + 1] === "B") {
    ctx.fillStyle = "#1c2230";
    ctx.fillRect(x - 2, y - 2, TILE * 2 + 4, TILE + 4);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "26px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🦅", x + TILE, y + TILE / 2 + 2);
    ctx.strokeStyle = "#f5b942";
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, TILE * 2 + 2, TILE + 2);
  }
}

function drawTree(x, y) {
  ctx.fillStyle = "rgba(22,90,48,0.9)";
  for (const [ox, oy] of [[8, 20], [20, 22], [14, 12], [24, 10], [6, 10], [18, 6]]) {
    ctx.beginPath(); ctx.arc(x + ox, y + oy, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "rgba(34,130,66,0.9)";
  for (const [ox, oy] of [[12, 16], [22, 16], [8, 16]]) {
    ctx.beginPath(); ctx.arc(x + ox, y + oy, 7, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBullet(b, color) {
  ctx.fillStyle = color;
  ctx.save();
  ctx.translate(b.x + BULLET_SIZE / 2, b.y + BULLET_SIZE / 2);
  ctx.rotate(DIRS[b.dir].a);
  ctx.fillRect(-4, -2, 8, 4);
  ctx.restore();
}

function drawTank(t) {
  const s = TANK_SIZE;
  const blinking = t.isEnemy && t.inv === undefined ? false : (t.inv !== undefined && t.inv > 0 && Math.floor(t.inv * 10) % 2 === 0);
  if (blinking) return; // 无敌闪烁时隐藏
  ctx.save();
  ctx.translate(t.x + s / 2, t.y + s / 2);
  ctx.rotate(DIRS[t.dir].a);

  // 履带
  ctx.fillStyle = t.tread || "#1f2937";
  ctx.fillRect(-s / 2, -s / 2, s, 5);
  ctx.fillRect(-s / 2, s / 2 - 5, s, 5);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  for (let i = -s / 2 + 3; i < s / 2; i += 5) {
    ctx.fillRect(i, -s / 2, 2, 5);
    ctx.fillRect(i, s / 2 - 5, 2, 5);
  }

  // 车身
  ctx.fillStyle = t.color;
  rrect(-s / 2 + 3, -s / 2 + 5, s - 6, s - 10, 3);
  ctx.fill();

  // 炮塔
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5; ctx.stroke();

  // 炮管
  ctx.fillStyle = t.tread || "#1f2937";
  ctx.fillRect(-2.5, -s / 2 + 2, 5, s / 2 - 6);

  ctx.restore();

  // 重甲标记（重型坦克）
  if (t.hp && t.hp > 1) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.hp, t.x + s / 2, t.y + s / 2);
  }
}

// ============ 启动 ============
loadLevel(1);
resetPlayer();
updateHUD();
requestAnimationFrame(loop);
</script>
